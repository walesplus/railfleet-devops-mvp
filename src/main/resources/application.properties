spring.application.name=railfleet-api
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/railfleet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:railfleet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:railfleet}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}